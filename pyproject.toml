[project]
name = "notadory-memory-mcp"
version = "1.0.0"
description = "File-backed versioned memory MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.6"]

[project.scripts]
notadory-memory-mcp = "notadory_memory.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notadory_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=notadory_memory", "--cov-report=term-missing", "--cov-fail-under=80"]

[tool.ruff]
target-version = "py310"
line-length = 120
lint.select = ["E4", "E7", "E9", "F", "I"]
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/notadory_memory/service.py" = ["F401"]
