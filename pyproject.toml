[project]
name = "notadory-memory-mcp"
version = "1.0.0"
description = "File-backed versioned memory MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
notadory-memory-mcp = "notadory_memory.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notadory_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
